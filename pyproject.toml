[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solvanity-contract"
version = "0.1.0"
description = "Custom CUDA vanity grinder for Solana create_with_seed account addresses"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["solders>=0.26,<0.30", "numpy>=1.24"]

[project.optional-dependencies]
cuda = ["cupy-cuda12x>=13,<15"]
test = ["pytest>=8"]

[project.scripts]
solvanity-contract = "solvanity_contract.__main__:main"

[tool.setuptools.packages.find]
include = ["solvanity_contract*"]

[tool.setuptools.package-data]
solvanity_contract = ["kernel.cu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
