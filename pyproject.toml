[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solvanity"
version = "0.2.0"
description = "CPU-verified CUDA vanity search for Solana wallets and seeded accounts"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["PyNaCl>=1.5", "solders>=0.26,<0.30", "numpy>=1.24"]

[project.optional-dependencies]
cuda12 = ["cupy-cuda12x>=13,<15"]
cuda13 = ["cupy-cuda13x>=14,<15"]
notebook = ["ipywidgets>=8.1,<9"]
test = ["pytest>=8", "setuptools>=68", "wheel", "pip"]

[project.scripts]
solvanity = "solvanity.__main__:main"
solvanity-wallet = "solvanity_wallet.__main__:main"
solvanity-contract = "solvanity_contract.__main__:main"

[tool.setuptools.packages.find]
include = ["solvanity", "solvanity.*", "solvanity_wallet*", "solvanity_contract*"]

[tool.setuptools.package-data]
solvanity_wallet = ["cuda/*.cu", "cuda/vendor/*"]
solvanity_contract = ["kernel.cu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
