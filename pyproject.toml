[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solvanity-wallet"
version = "0.1.0"
description = "CSPRNG-fed CUDA Ed25519 vanity wallet grinder"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["PyNaCl>=1.5", "solders>=0.21", "numpy>=1.24"]

[project.optional-dependencies]
cuda12 = ["cupy-cuda12x>=13"]
cuda13 = ["cupy-cuda13x>=14"]
test = ["pytest>=8"]

[project.scripts]
solvanity-wallet = "solvanity_wallet.__main__:main"

[tool.setuptools.package-data]
solvanity_wallet = ["cuda/*.cu", "cuda/vendor/*"]
